{% extends 'authentication/base.html' %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'authentication/css/style.css' %}">
{% endblock %}


{% block content %}
<!-- Outer Row -->
<div class="row justify-content-center">

    <div class="col-xl-10 col-lg-12 col-md-9">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-6 d-none d-lg-block bg-login-image">
                        <img src="/static/base/img/logo.png"
                            alt="docman" class="img-fluid">
                    </div>
                    <div class="col-lg-6">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                            </div>
                            <form class="user" id="login-form">
                                <div class="form-group">
                                    <input type="text" name="username" class="form-control form-control-user"
                                        id="username" aria-describedby="usernamelHelp"
                                        placeholder="Enter Username...">
                                </div>
                                <div class="form-group">
                                    <input type="password" name="password" class="form-control form-control-user"
                                        id="exampleInputPassword" placeholder="Password">
                                </div>
                                <div class="form-group">
                                    <div class="custom-control custom-checkbox small">
                                        <input type="checkbox" class="custom-control-input" id="rememberMe">
                                        <label class="custom-control-label" for="rememberMe">Remember
                                            Me</label>
                                    </div>
                                </div>
                                <button class="btn btn-primary btn-user btn-block">
                                    Login
                                </button>
                                <!-- <hr> -->
                                <!-- <a href="index.html" class="btn btn-google btn-user btn-block">
                                        <i class="fab fa-google fa-fw"></i> Login with Google
                                    </a>
                                    <a href="index.html" class="btn btn-facebook btn-user btn-block">
                                        <i class="fab fa-facebook-f fa-fw"></i> Login with Facebook
                                    </a> -->
                            </form>
                            <!-- <hr> -->
                            <!-- <div class="text-center">
                                <a class="small" href="forgot-password.html">Forgot Password?</a>
                            </div>
                            <div class="text-center">
                                <a class="small" href="register.html">Create an Account!</a>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>


{% endblock %}

{% block js %}
<script>
    const login_api_url = "/api/v1/auth/login/";
    const permission_api_url = "/api/v1/rbac/permissions/";
    const category_permission_api_url = "/api/v1/rbac/category-permissions/";
    const account_activation_page = false;
    const recover_password_page = true;
</script>

<!-- Authentication JS -->
<script src="{% static 'authentication/js/authentication.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
