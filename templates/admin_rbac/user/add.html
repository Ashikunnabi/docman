{% extends 'base/base.html' %}
{% load static %}
{% block css %}
{% endblock %}

{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">User</h1>
        <!-- <a href="#"
                       class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i
                            class="fas fa-download fa-sm text-white-50"></i> Generate
                        Report</a> -->
    </div>
    <p class="mb-4">
        Users are valuable. See list of Registered user.
        Only active staff can be an admin of this system.
    </p>


    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">User Add</h6>
        </div>
        <div class="card-body">
            <form id="user_add" data-parsley-validate enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Username: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" name="username"
                                data-parsley-maxlength="256" placeholder="Enter username here (max 256 chars)."
                                required>
                        </div>

                        <div class="form-group">
                            <label for="name">First Name: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                data-parsley-maxlength="256" placeholder="Enter first name here (max 256 chars)."
                                required>
                        </div>

                        <div class="form-group">
                            <label for="name">Last Name: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                data-parsley-maxlength="256" placeholder="Enter last name here (max 256 chars)."
                                required>
                        </div>

                        <!-- <div class="form-group">
                            <label for="password">Password: <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter password here." required>
                        </div> -->
                    </div>
                    <div class="col-md-6">

                        <div class="form-group">
                            <label for="email">Email: <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="Enter email address here." required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone: </label>
                            <input type="number" class="form-control" id="phone" name="phone"
                                data-parsley-maxlength="11" placeholder="11 digit mobile number. Example: 01789000000.">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="password">Password: <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password"
                                data-parsley-minlength="8"
                                data-parsley-minlength-message="Password must be at least 8 characters long."
                                data-parsley-pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                                data-parsley-pattern-message="Password must contain at least one uppercase letter, one lowercase letter, one number and one special character."
                                placeholder="Enter password here." required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="password1">Re-enter Password: <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password1" name="password1"
                                placeholder="Re-enter password here." data-parsley-equalto="#password"
                                data-parsley-equalto-message="Password doesn't matched" required>
                        </div>
                    </div>
                </div>
                <!-- <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_staff" name="is_staff">
                        <label class="custom-control-label" for="is_staff">Staff (can access admin panel)</label>
                    </div>
                </div> -->

                <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_active" name="is_active">
                        <label class="custom-control-label" for="is_active">Active (can access the system)</label>
                    </div>
                </div>

                <div class="failed"></div>

                <input type="submit" class="btn btn-primary float-right">
            </form>
        </div>
    </div>

</div>
{% endblock %}


{% block js %}
<script>
    const page = "add";
    const user_api_url = "{% url 'apps:rbac:api:v1:user_list_create' %}";
    const user_list_url = "{% url 'admin:admin_rbac:user_list' %}";
</script>

<!-- user JS -->
<script src="{% static 'admin_rbac/js/user.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
