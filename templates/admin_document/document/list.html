{% extends 'base/base.html' %}
{% load static %}
{% block css %}
<style>
    .card-header {
        display: flex;
        justify-content: space-between;
    }

    .create-category {
        cursor: pointer;
        color: #4e73df;
        font-size: x-large;
    }

    /* Basic styling for breadcrumbs */
    .breadcrumb {
        padding: 10px;
        background-color: #f8f9fa;
        border-radius: 4px;
        margin-bottom: 20px;
    }

    .breadcrumb a {
        text-decoration: none;
        color: #007bff;
    }

    .breadcrumb a:hover {
        text-decoration: underline;
    }

    .breadcrumb span {
        color: #6c757d;
    }

    .breadcrumb .separator {
        margin: 0 5px;
    }

    .actionButton {
        cursor: pointer;
        font-size: 1em;
        margin-left: 10px;
        background: #3785c1;
        color: #fff;
        padding: 3px 4px;
        border-radius: 3px;
    }
</style>
{% endblock %}

{% block content %}
{% csrf_token %}
<div class="container-fluid">

    <!-- Page Heading -->

            <i class="fas fa-download fa-sm text-white-50"></i> Generate
            Report
        </a>
    </div> -->

        Documents are valuable. See list of Registered document.
        Only active staff can be an admin of this system.
    </p> -->


    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Document List</h6>
            <div>
                <i class="fa fa-folder-plus create-category" title="Create New Folder"></i>
            </div>
        </div>
        <div class="card-body">
            <!-- Breadcrumb container -->
            <nav id="breadcrumb" class="breadcrumb">
                <!-- Breadcrumb items will be dynamically generated here -->
            </nav>
            <div class="table-responsive">
                <table class="table table-bordered table-hover row-select" id="documentDataTable">
                </table>
            </div>
        </div>
    </div>

</div>
{% endblock %}
