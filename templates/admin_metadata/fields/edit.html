{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->

         <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Metadata Field Edit</h6>
        </div>
        <div class="card-body">
            <form id="user_edit" data-parsley-validate enctype="multipart/form-data" autocomplete="off">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Username: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" name="username"
                                data-parsley-maxlength="256" placeholder="Enter username here (max 256 chars)."
                                disabled>
                        </div>

                        <div class="form-group">
                            <label for="name">First Name: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                data-parsley-maxlength="256" placeholder="Enter first name here (max 256 chars)."
                                required>
                        </div>

                        <div class="form-group">
                            <label for="name">Last Name: <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                data-parsley-maxlength="256" placeholder="Enter last name here (max 256 chars)."
                                required>
                        </div>

                        <!-- <div class="form-group">
                            <label for="password">Password: <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter password here." required>
                        </div> -->
                    </div>
                    <div class="col-md-6">

                        <div class="form-group">
                            <label for="email">Email: <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="Enter email address here." required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone: </label>
                            <input type="number" class="form-control" id="phone" name="phone"
                                data-parsley-maxlength="11" placeholder="11 digit mobile number. Example: 01789000000.">
                        </div>
                    </div>
                </div>
                <!-- <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_staff" name="is_staff">
                        <label class="custom-control-label" for="is_staff">Staff (can access admin panel)</label>
                    </div>
                </div> -->

                <div class="form-group">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_active" name="is_active">
                        <label class="custom-control-label" for="is_active">Active (can access the system)</label>
                    </div>
                </div>

                <div class="failed"></div>

                <input type="submit" class="btn btn-primary float-right">
            </form>
        </div>
    </div>
