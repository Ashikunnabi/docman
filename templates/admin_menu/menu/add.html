{% extends 'base/base.html' %}
{% load static %}
{% block css %}
{% endblock %}

{% block content %}
<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Menu</h1>
        <!-- <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"><i
                class="fas fa-download fa-sm text-white-50"></i> Generate
            Report</a> -->
    </div>
    <p class="mb-4">
        <!-- Only active menu will be shown in home page.
        Menus are awesome for user experience.
        Please make sure you have full HD menu images. -->
    </p>


    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Menu Add</h6>
        </div>
        <div class="card-body">
            <form id="menu_add" data-parsley-validate enctype="multipart/form-data">
                <div class="form-menu">
                    <label for="name">Name: <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" data-parsley-maxlength="50"
                        placeholder="Enter menu name here (max 50 chars)." required>
                </div>

                <div class="row">
                    <div class="col-4">
                        <label for="type">Type: <span class="text-danger">*</span></label>
                        <select class="form-control" id="type_uuid" name="type_uuid" required></select>
                    </div>
                </div>

                <div class="row">
                    <div class="form-menu col-4">
                        <label for="start_at">Start At: <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="start_at" name="start_at" required>
                    </div>

                    <div class="form-menu col-4">
                        <label for="end_at">End At: <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="end_at" name="end_at" required>
                    </div>
                </div>

                <div class="form-menu">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_active" name="is_active">
                        <label class="custom-control-label" for="is_active">Is Active?</label>
                    </div>
                </div>

                <div class="form-menu">
                    <div class="custom-control custom-checkbox small">
                        <input type="checkbox" class="custom-control-input" id="is_pinned" name="is_pinned">
                        <label class="custom-control-label" for="is_pinned">Is Pinned?</label>
                        <span><small>Pin it to show in home page</small></span>
                    </div>
                </div>

                <input type="submit" class="btn btn-primary float-right">
            </form>
        </div>
    </div>

</div>
{% endblock %}


{% block js %}
<script>
    const page_type = "add";
    const api_urls = {
        "menu_list": "{% url 'apps:menu:dashboard_api:v1:dashboard_menu_list_create' %}",
        "menu_type_list": "{% url 'apps:menu:dashboard_api:v1:dashboard_menu_type_list_create' %}",
    }
    const menu_list_url = "{% url 'admin:admin_menu:menu_list' %}";
</script>

<!-- Menu JS -->
<script type="module" src="{% static 'admin_menu/js/menu.js' %}?v={{JS_VERSION}}"></script>
{% endblock %}
