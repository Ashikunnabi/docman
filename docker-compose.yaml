services:
  web:
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    image: docman_web
    container_name: docman_web
    command: /start
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - db
    networks:
      - docman_network

  db:
    image: postgres:13.0-alpine
    container_name: docman_db
    restart: unless-stopped
    volumes:
      - docman_postgres_data:/var/lib/postgresql/data
      - docman_postgres_data_dbback:/dbback
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - docman_network

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    image: docman_nginx
    container_name: docman_nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - web
    ports:
      - "8082:80"
    networks:
      - docman_network

networks:
    docman_network:
        driver: bridge

volumes:
  docman_postgres_data: {}
  docman_postgres_data_dbback: {}
